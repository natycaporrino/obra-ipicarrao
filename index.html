<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Obra do Espaço das Crianças</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: faixa azul com logo e "onde estamos"; a linha do tempo vertical é o centro da página; depois campanha, fotos, documentos e novidades. Coluna única de leitura. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#16213A; --muted:#5A6680; --line:#DCE3EE;
  --navy:#1E3A6E; --sky:#BFE3F5; --skyink:#16213A;
  --blue:#2F6DB5; --red:#D23B33; --green:#3E9B4F; --yellow:#E9B522;
  --ok:#3E9B4F; --okbg:#DDF2E1; --okink:#1F6B2E;
  --now:#E9B522; --nowbg:#FFF1C7; --nowink:#7A5600;
  --next:#AAB4C6; --nextbg:#E8ECF3; --nextink:#4D5870;
  --display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1726; --surface:#17213A; --ink:#E9EEF7; --muted:#A3AEC4; --line:#2A3654;
  --navy:#16294E; --sky:#2A4A6E; --skyink:#E9EEF7;
  --blue:#6FA3E6; --red:#F07A72; --green:#6CC47C; --yellow:#F2C94C;
  --ok:#6CC47C; --okbg:#173D22; --okink:#9BE3AA; --now:#F2C94C; --nowbg:#4A3B10; --nowink:#FFE08A;
  --next:#5C6884; --nextbg:#26314C; --nextink:#C3CBDB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#17213A; --ink:#E9EEF7; --muted:#A3AEC4; --line:#2A3654;
  --navy:#16294E; --sky:#2A4A6E; --skyink:#E9EEF7;
  --blue:#6FA3E6; --red:#F07A72; --green:#6CC47C; --yellow:#F2C94C;
  --ok:#6CC47C; --okbg:#173D22; --okink:#9BE3AA; --now:#F2C94C; --nowbg:#4A3B10; --nowink:#FFE08A;
  --next:#5C6884; --nextbg:#26314C; --nextink:#C3CBDB; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
.top{background:var(--navy);color:#fff}
.top .wrap{padding-block:26px 24px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:64px;border-radius:50%;background:#fff;padding:2px;flex:none}
.brand small{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.brand h1{font-size:clamp(24px,5vw,34px)}
.now{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.now .lbl{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.now .big{font-family:var(--display);font-size:clamp(20px,4.4vw,25px);font-weight:600}
.now .nmeta{font-size:14px;opacity:.85}
.stripe{display:flex;height:6px}.stripe i{flex:1}
nav.jump{display:flex;gap:8px;overflow-x:auto;padding-block:14px 0}
nav.jump a{flex:none;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
main.wrap{padding-block:18px 48px;display:grid;gap:34px}
.aviso{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
section{display:grid;gap:14px;min-width:0;scroll-margin-top:16px}
section>h2{font-size:23px}
.lead{margin:-6px 0 0;color:var(--muted);font-size:15px}
/* linha do tempo */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 12px;position:relative}
.tl>li:before{content:"";position:absolute;left:19px;top:0;bottom:0;width:3px;background:var(--line)}
.tl>li:first-child:before{top:22px}.tl>li:last-child:before{bottom:calc(100% - 22px)}
.tl>li.feito:before{background:var(--ok)}
.node{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:17px;margin-top:2px}
.feito .node{background:var(--ok);color:#fff}
.agora .node{background:var(--now);color:#1b1b1b;box-shadow:0 0 0 6px var(--nowbg)}
.proximo .node{background:var(--surface);color:var(--nextink);border:3px solid var(--next)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:grid;gap:6px;min-width:0}
.agora .card{border:2px solid var(--now)}
.card .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card h3{font-size:19px;flex:1 1 220px}
.when{font-size:14px;font-weight:700;color:var(--muted)}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:3px 10px;white-space:nowrap}
.tag.feito{background:var(--okbg);color:var(--okink)}.tag.agora{background:var(--now);color:#1b1b1b}.tag.proximo{background:var(--nextbg);color:var(--nextink)}
.card p{margin:0;font-size:15px;color:var(--muted)}
.who{font-size:14px;color:var(--muted)}.who b{color:var(--ink)}
.tasks{display:grid;gap:6px;margin-top:4px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:15px;align-items:start}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--next);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.check.feito{background:var(--ok);border-color:var(--ok);color:#fff}
.check.andamento{border-color:var(--now);background:var(--nowbg)}
.task small{display:block;color:var(--muted);font-size:13.5px}
details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--blue);list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}
.paralelo{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.mini b{font-size:15px}.mini span{font-size:13.5px;color:var(--muted)}
/* campanha */
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.meta{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start}
.meta .v{font-family:var(--display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.meta .lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta p{margin:0;font-size:14px;color:var(--muted)}
.prog{height:12px;border-radius:6px;background:var(--nextbg);overflow:hidden}.prog i{display:block;height:100%;border-radius:6px;background:var(--green)}
.meta .st{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.contrib{background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px;display:grid;gap:8px}
.contrib h3{font-size:19px}.contrib ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.invest{font-size:15px;color:var(--muted)}.invest b{color:var(--ink)}
/* fotos e documentos */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--nextbg)}
.gal figcaption{font-size:13.5px;padding:8px 10px;color:var(--muted)}
.gal a{color:inherit;text-decoration:none}
.docs{display:grid;gap:8px}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none;min-width:0}
.doc .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--sky);color:var(--skyink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.doc b{display:block;font-size:15px;overflow-wrap:anywhere}.doc span{font-size:13px;color:var(--muted)}
.vazio{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.news{display:grid;gap:10px}
.new{background:var(--surface);border-radius:12px;border:1px solid var(--line);padding:14px 16px}
.new time{font-size:13px;font-weight:700;color:var(--blue)}
.new h3{font-size:17px;margin:2px 0 4px}.new p{margin:0;font-size:15px;white-space:pre-line}
footer{font-size:13px;color:var(--muted);text-align:center}
/* edição (só quem tem acesso de edição) */
.editbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--yellow);color:#1b1b1b;display:none}
.editbar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:10px}
.editing .editbar{display:block}
.editbar .msg{flex:1;min-width:180px;font-weight:700;font-size:14px}
button,.btnl{font:inherit;font-weight:700;border-radius:10px;border:1px solid transparent;padding:8px 14px;cursor:pointer;font-size:15px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn-pri{background:var(--navy);color:#fff}.btn-sec{background:transparent;border-color:currentColor;color:inherit}
.btn-edit{justify-self:start;background:var(--yellow);color:#1b1b1b}
.btn-sm{padding:4px 10px;font-size:13px}.btn-del{background:transparent;color:var(--red);border-color:var(--red)}
.ed{display:none}.editing .ed{display:grid}.editing .vw{display:none}
.form{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.form label{display:grid;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.form .wide{grid-column:1/-1}
.form .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
.priv{font-size:12px;font-weight:700;color:var(--red)}
@media (prefers-reduced-motion:no-preference){.agora .node{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px var(--nowbg)}}}
</style>

const MS={feito:"Concluído",agora:"Estamos aqui",proximo:"Próximo"};
const TS={nao:"A fazer",andamento:"Em andamento",feito:"Feito"};
let S=JSON.parse(document.getElementById("state").textContent);
let DL=null, D=null, editing=false, canWrite=false, A=null, ASSETS=null, DB=null, NOMES={}, nomesD={}, nomesOk=false;
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(v==null||v==="")?"a informar":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const fd=d=>{if(!d)return"";const[y,m,dd]=String(d).split("-");return `${dd}/${m}/${y}`};
const cur=()=>editing?D:S;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const nome=id=>(editing?nomesD:NOMES)[id]||"";
function setPath(o,path,v){const k=path.split(".");let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v;}
function getPath(o,path){return path.split(".").reduce((x,k)=>x==null?x:x[k],o);}
function f(path,label,type="text",cls=""){
  const v=getPath(D,path)??"";const id="f-"+path.replace(/\./g,"-");
  if(type==="textarea")return `<label class="${cls}">${label}<textarea id="${id}" data-path="${path}">${esc(v)}</textarea></label>`;
  if(type.startsWith("sel:")){const o=JSON.parse(type.slice(4));return `<label class="${cls}">${label}<select id="${id}" data-path="${path}">${Object.entries(o).map(([k,t])=>`<option value="${k}"${k===v?" selected":""}>${esc(t)}</option>`).join("")}</select></label>`;}
  return `<label class="${cls}">${label}<input id="${id}" type="${type}" data-path="${path}" data-type="${type}" value="${esc(v)}"></label>`;
}
function fn(tid,cls=""){return nomesOk?`<label class="${cls}">Nome(s) <span class="priv">não aparece para a igreja</span><input id="nm-${tid}" data-nome="${tid}" value="${esc(nomesD[tid]||"")}"></label>`:"";}
function who(grupo,id){const n=nome(id);return `${esc(grupo||"A definir")}${n?` <span class="priv">· ${esc(n)}</span>`:""}`;}

function view(){
  const s=cur(); const ag=s.marcos.find(m=>m.status==="agora");
  const feitos=s.marcos.filter(m=>m.status==="feito").length;
  let h=`<div class="editbar"><div class="wrap"><span class="msg" id="msg">Editando. A igreja só vê as mudanças depois de publicar.</span>
   <button class="btn-sec" id="b-cancel">Cancelar</button><button class="btn-pri" id="b-save">Publicar alterações</button></div></div>
  <header class="top"><div class="wrap">
   <div class="brand"><img src="${LOGO}" alt="Logo da IPI Vila Carrão"><div><small>IPI Vila Carrão</small><h1>${esc(s.titulo)}</h1></div></div>
   <div class="now"><span class="lbl">Onde estamos</span><span class="big">${ag?esc(ag.titulo):"Acompanhe a obra abaixo"}</span>
    <span class="nmeta">${feitos} de ${s.marcos.length} marcos concluídos · atualizado em ${fd(s.atualizado)}</span></div>
   ${canWrite?`<div class="vw" style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn-edit" id="b-edit">Atualizar a obra</button>${DL?`<button class="btn-sec" id="b-export" style="color:#fff">Baixar página para o site</button>`:""}</div><span class="vw" id="exmsg" style="font-size:14px;opacity:.9"></span>`:""}
  </div></header>
  <div class="stripe"><i style="background:var(--blue)"></i><i style="background:var(--red)"></i><i style="background:var(--green)"></i><i style="background:var(--yellow)"></i><i style="background:var(--sky)"></i></div>
  <div class="wrap"><nav class="jump" aria-label="Seções"><a href="#linha">Linha do tempo</a><a href="#campanha">Campanha</a><a href="#fotos">Fotos</a><a href="#documentos">Documentos</a><a href="#novidades">Novidades</a></nav></div>
  <main class="wrap">
   ${(s.aviso||editing)?`<div class="aviso"><span class="vw">${esc(s.aviso)}</span><div class="ed form">${editing?f("aviso","Aviso no topo","text","wide"):""}</div></div>`:""}

   <section id="linha"><h2>Linha do tempo da obra</h2>
    <ol class="tl">${s.marcos.map((m,i)=>marco(m,i)).join("")}</ol>
    ${editing?`<button class="btn-sec btn-sm" id="b-addm" style="justify-self:start">+ Adicionar marco</button>`:""}
   </section>

   <section><h2>Em paralelo</h2><p class="lead">Projetos que andam junto com a obra.</p>
    <div class="paralelo vw">${s.paralelo.map(t=>`<div class="mini"><b>${esc(t.titulo)}</b><span>${who(t.grupo,t.id)} · ${esc(t.prazo||"prazo a definir")}</span><span>${TS[t.status]||""}</span></div>`).join("")}</div>
    ${editing?`<div class="ed" style="gap:8px">${s.paralelo.map((t,i)=>tarefaEd(`paralelo.${i}`,t,"paralelo",i)).join("")}<button class="btn-sec btn-sm" data-addt="paralelo" style="justify-self:start">+ Adicionar projeto</button></div>`:""}
   </section>

   <section id="campanha"><h2>Campanha e recursos</h2>
    <div class="metas">${s.campanha.metas.map((m,i)=>{const p=m.arrecadado!=null&&m.valor?Math.min(100,Math.round(m.arrecadado/m.valor*100)):0;
      return `<div class="meta"><span class="lbl">Meta</span><h3>${esc(m.nome)}</h3><span class="v">${brl(m.valor)}</span><p>${esc(m.inclui)}</p>
      <div class="prog" role="img" aria-label="${p}% arrecadado"><i style="width:${p}%"></i></div><span class="st">Arrecadado: ${brl(m.arrecadado)}${m.arrecadado!=null?` (${p}%)`:""}</span>
      ${editing?`<div class="ed form">${f(`campanha.metas.${i}.nome`,"Nome","text","wide")}${f(`campanha.metas.${i}.valor`,"Meta (R$)","number")}${f(`campanha.metas.${i}.arrecadado`,"Arrecadado (R$)","number")}${f(`campanha.metas.${i}.inclui`,"O que inclui","textarea","wide")}</div>`:""}</div>`}).join("")}</div>
    <p class="invest">Já investido na obra: <b>${brl(s.campanha.investido)}</b></p>
    ${editing?`<div class="ed form">${f("campanha.investido","Já investido (R$)","number")}${f("campanha.contribuir","Como contribuir (uma linha por item)","textarea","wide")}</div>`:""}
    <div class="contrib"><h3>Como contribuir</h3><ul>${String(s.campanha.contribuir||"").split("\n").filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>
   </section>

   <section id="fotos"><h2>Fotos</h2>
    ${editing?upl("foto","image/*","Adicionar fotos"):""}
    ${s.fotos.length?`<div class="gal">${s.fotos.map((p,i)=>`<figure><a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" alt="${esc(p.legenda||"Foto da obra")}" loading="lazy"></a><figcaption>${esc(p.legenda)}${p.data?` · ${fd(p.data)}`:""}</figcaption>
      ${editing?`<div class="ed form" style="border:0;border-radius:0">${f(`fotos.${i}.legenda`,"Legenda","text","wide")}<div class="acts"><button class="btn-del btn-sm" data-del="fotos.${i}">Remover</button></div></div>`:""}</figure>`).join("")}</div>`:`<div class="vazio">As fotos da obra vão aparecer aqui.</div>`}
   </section>

   <section id="documentos"><h2>Documentos</h2>
    ${editing?upl("doc","application/pdf,image/*","Adicionar documento"):""}
    ${s.docs.length?`<div class="docs">${s.docs.map((d,i)=>`<div><a class="doc" href="${esc(d.url)}" target="_blank" rel="noopener"><span class="ic">${esc(d.tipo||"PDF")}</span><span><b>${esc(d.titulo)}</b><span>${fd(d.data)}</span></span></a>
      ${editing?`<div class="ed form">${f(`docs.${i}.titulo`,"Título","text","wide")}<div class="acts"><button class="btn-del btn-sm" data-del="docs.${i}">Remover</button></div></div>`:""}</div>`).join("")}</div>`:`<div class="vazio">Projetos e documentos da obra vão aparecer aqui.</div>`}
   </section>

   <section id="novidades"><h2>Novidades</h2>
    ${editing?`<div class="ed form"><label>Data<input type="date" id="n-data"></label><label class="wide">Título<input id="n-titulo"></label><label class="wide">Texto<textarea id="n-texto"></textarea></label><div class="acts"><button class="btn-sec btn-sm" id="b-addn">Adicionar novidade</button></div></div>`:""}
    <div class="news">${s.novidades.length?s.novidades.map((n,i)=>[n,i]).sort((a,b)=>String(b[0].data).localeCompare(a[0].data)).map(([n,i])=>`<article class="new"><time>${fd(n.data)}</time><h3>${esc(n.titulo)}</h3><p>${esc(n.texto)}</p>${editing?`<div class="ed form" style="margin-top:8px">${f(`novidades.${i}.texto`,"Texto","textarea","wide")}<div class="acts"><button class="btn-del btn-sm" data-del="novidades.${i}">Remover</button></div></div>`:""}</article>`).join(""):`<div class="vazio">As novidades da obra vão aparecer aqui.</div>`}</div>
   </section>
   <footer>Comissão de Construção e Manutenção · IPI Vila Carrão</footer>
  </main>`;
  app.innerHTML=h; app.classList.toggle("editing",editing); bind();
}
function marco(m,i){
  const n=i+1; const tasks=m.tarefas||[];
  const tv=tasks.length?`<div class="tasks">${tasks.map(t=>`<div class="task"><span class="check ${t.status}" aria-label="${TS[t.status]}">${t.status==="feito"?"✓":""}</span><span>${esc(t.titulo)}<small>${who(t.grupo,t.id)} · ${esc(t.prazo||"prazo a definir")} · ${TS[t.status]}</small></span></div>`).join("")}</div>`:"";
  return `<li class="${m.status}"><span class="node">${m.status==="feito"?"✓":n}</span><div class="card">
   <div class="head"><h3>${esc(m.titulo)}</h3><span class="tag ${m.status}">${MS[m.status]}</span></div>
   <span class="when">${esc(m.quando)}</span>${m.desc?`<p>${esc(m.desc)}</p>`:""}
   <span class="who">Quem cuida: <b>${who(m.grupo,m.id)}</b></span>
   ${tasks.length?(m.status==="agora"?tv:`<details><summary>Ver ${tasks.length} etapa${tasks.length>1?"s":""}</summary>${tv}</details>`):""}
   ${editing?`<div class="ed form">${f(`marcos.${i}.titulo`,"Marco","text","wide")}${f(`marcos.${i}.status`,"Situação",'sel:'+JSON.stringify(MS))}${f(`marcos.${i}.quando`,"Quando")}${f(`marcos.${i}.grupo`,"Quem cuida (grupo)")}${fn(m.id)}${f(`marcos.${i}.desc`,"Descrição","textarea","wide")}
     ${tasks.map((t,j)=>tarefaEd(`marcos.${i}.tarefas.${j}`,t,`marcos.${i}.tarefas`,j)).join("")}
     <div class="acts"><button class="btn-sec btn-sm" data-addt="marcos.${i}.tarefas">+ Etapa neste marco</button><button class="btn-del btn-sm" data-del="marcos.${i}">Remover marco</button></div></div>`:""}
  </div></li>`;
}
function tarefaEd(path,t,list,j){
  return `<div class="form ed wide" style="background:var(--surface)">${f(path+".titulo","Etapa","text","wide")}${f(path+".grupo","Quem cuida (grupo)")}${fn(t.id)}${f(path+".prazo","Prazo")}${f(path+".status","Situação",'sel:'+JSON.stringify(TS))}<div class="acts"><button class="btn-del btn-sm" data-del="${list}.${j}">Remover etapa</button></div></div>`;
}
function upl(kind,accept,label){
  if(!ASSETS)return `<div class="ed vazio">Envio de arquivos indisponível nesta visualização.</div>`;
  return `<div class="ed form"><label class="wide">${label}<input type="file" id="up-${kind}" accept="${accept}" ${kind==="foto"?"multiple":""}></label></div>`;
}
function bind(){
  const q=id=>document.getElementById(id);
  q("b-edit")?.addEventListener("click",()=>{D=JSON.parse(JSON.stringify(S));nomesD={...NOMES};editing=true;view();});
  q("b-cancel")?.addEventListener("click",()=>{D=null;editing=false;view();});
  q("b-save")?.addEventListener("click",save);
  q("b-export")?.addEventListener("click",exportar);
  app.querySelectorAll('a[href^="data:"]').forEach(async a=>{try{const b=await (await fetch(a.href)).blob();a.href=URL.createObjectURL(b);}catch(e){}});
  if(!editing)return;
  app.querySelectorAll("[data-path]").forEach(el=>el.addEventListener("change",()=>{let v=el.value;if(el.dataset.type==="number")v=v===""?null:Number(v);setPath(D,el.dataset.path,v);if(el.tagName==="SELECT")view();}));
  app.querySelectorAll("[data-nome]").forEach(el=>el.addEventListener("change",()=>{nomesD[el.dataset.nome]=el.value.trim();}));
  app.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.del.split(".");const idx=+k.pop();getPath(D,k.join(".")).splice(idx,1);view();}));
  app.querySelectorAll("[data-addt]").forEach(b=>b.addEventListener("click",()=>{getPath(D,b.dataset.addt).push({id:uid("t"),titulo:"Nova etapa",grupo:"Comissão",prazo:"",status:"nao"});view();}));
  q("b-addm")?.addEventListener("click",()=>{D.marcos.push({id:uid("m"),titulo:"Novo marco",quando:"",status:"proximo",grupo:"Comissão",desc:"",tarefas:[]});view();});
  q("b-addn")?.addEventListener("click",()=>{const t=q("n-titulo").value.trim();if(!t){msg("Escreva um título para a novidade.");return;}
    D.novidades.push({id:uid("n"),data:q("n-data").value||new Date().toISOString().slice(0,10),titulo:t,texto:q("n-texto").value.trim()});view();});
  ["foto","doc"].forEach(kind=>q("up-"+kind)?.addEventListener("change",async e=>{
    const files=[...e.target.files];if(!files.length)return;msg("Enviando arquivo…");
    for(const file of files){try{const r=await ASSETS.upload(file);const base=file.name.replace(/\.[^.]+$/,"");const hoje=new Date().toISOString().slice(0,10);
      if(kind==="foto")D.fotos.unshift({id:r.id,url:r.url,legenda:base,data:hoje});
      else D.docs.unshift({id:r.id,url:r.url,titulo:base,data:hoje,tipo:/pdf/i.test(file.type)?"PDF":"IMG"});}
      catch(err){msg("Não foi possível enviar "+file.name+". Tente um arquivo menor.");return;}}
    view();msg("Arquivo enviado. Publique para a igreja ver.");}));
}
function msg(t){const m=document.getElementById("msg");if(m)m.textContent=t;}
function buildDoc(st){
  const json=JSON.stringify(st,null,1).replace(/</g,"\\u003c");
  const reset=document.head.querySelector("style")?.textContent||"";
  const head=`<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${reset}</style></head><body>`;
  const parts=[...document.body.children].filter(el=>["TITLE","META","LINK","STYLE"].includes(el.tagName)).map(el=>el.outerHTML).join("\n");
  return head+parts+`\n\n<div id="app"></div>\n\n<script type="application/json" id="state">${json}<\/script>\n`+document.getElementById("appjs").outerHTML+`</body></html>`;
}
async function toData(url){const b=await (await fetch(url)).blob();return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b);});}
async function exportar(){
  const m=document.getElementById("exmsg");const say=t=>{if(m)m.textContent=t;};
  if(!DL){say("Não foi possível baixar daqui.");return;}
  say("Preparando o arquivo…");
  try{const st=JSON.parse(JSON.stringify(S));
    for(const x of [...st.fotos,...st.docs]){if(x.url&&!String(x.url).startsWith("data:")){try{x.url=await toData(x.url);}catch(e){}}}
    await DL.save({filename:"index.html",data:new Blob([buildDoc(st)],{type:"text/html"})});
    say("Arquivo baixado. Arraste o index.html no Netlify para atualizar o link da igreja.");
  }catch(err){say(err&&err.code==="rejected"?"Download cancelado.":"Não foi possível baixar agora. Tente de novo.");}
}
async function save(){
  if(!A){msg("Você não tem permissão para publicar.");return;}
  const b=document.getElementById("b-save");b.disabled=true;msg("Publicando…");
  try{
    if(DB&&nomesOk){const clean={};Object.entries(nomesD).forEach(([k,v])=>{if(v)clean[k]=v;});
      if(JSON.stringify(clean)!==JSON.stringify(NOMES))await DB.doc("nomes/mapa").set(clean);}
    D.atualizado=new Date().toISOString().slice(0,10);
    await A.publish(buildDoc(D));msg("Publicado. A página vai recarregar.");
  }catch(err){b.disabled=false;const c=err&&err.code;
    if(c==="not_writer"||c==="not_granted"){canWrite=false;msg("Você pode ver a página, mas não pode editar.");}
    else if(c==="conflict")msg("Outra versão foi publicada antes. A página vai recarregar.");
    else msg("Não foi possível publicar agora. Tente de novo em instantes.");}
}
view();
(async()=>{try{
  const u=await window.claude?.use?.("user"); if(!u)return;
  if(!(await u.isOwner()))return;
  A=await window.claude.use("artifact"); canWrite=!!A;
  ASSETS=await window.claude.use("assets");
  DL=await window.claude.use("downloads");
  DB=await window.claude.use("db");
  if(DB){try{const snap=await DB.doc("nomes/mapa").get();NOMES=snap.exists?(snap.data()||{}):{};nomesOk=true;}catch(e){}}
  if(!editing)view();
}catch(e){}})();
})();
</script>
</body></html>
